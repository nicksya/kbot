# -------------------------------------------------------------------
# kbot application settings (UNCHANGED)
# -------------------------------------------------------------------
replicaCount: 1
image:
  repository: mykytakhomenko/kbot
  tag: "v1.0.7-otel"
  arch: arm64
  os: linux
  registry: "docker.io"
secret:
  envName: "TELE_TOKEN"
  tokenKey: "token"
  tokenName: "kbot"
securityContext:
  privileged: true

# kbot → observability wiring
env:
  - name: METRICS_HOST
    value: "kbot-opentelemetry-collector:4317"

# -------------------------------------------------------------------
# OpenTelemetry Collector
# -------------------------------------------------------------------
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  #   tag: 0.78.0-arm64
  command:
    name: otelcol-contrib

  # ports:
  #   otlp:
  #     enabled: true
  #     containerPort: 4317
  #     servicePort: 4317

  #   otlp-http:
  #     enabled: true
  #     containerPort: 3030
  #     servicePort: 3030

  #   prometheus:
  #     enabled: true
  #     containerPort: 8889
  #     servicePort: 8889

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:3030"

    exporters:
      logging: {}
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [logging, loki]
        traces:
          receivers: [otlp]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          exporters: [logging, prometheus]
