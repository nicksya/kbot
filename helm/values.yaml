# -------------------------------------------------------------------
# kbot application settings (UNCHANGED)
# -------------------------------------------------------------------
replicaCount: 1
image:
  repository: mykytakhomenko/kbot
  tag: "v1.0.7-otel"
  arch: arm64
  os: linux
  registry: "docker.io"
secret:
  envName: "TELE_TOKEN"
  tokenKey: "token"
  tokenName: "kbot"
securityContext:
  privileged: true

# kbot → observability wiring
env:
  - name: METRICS_HOST
    value: "kbot-opentelemetry-collector:4317"

# -------------------------------------------------------------------
# OpenTelemetry Collector
# -------------------------------------------------------------------
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  #   tag: 0.78.0-arm64
  command:
    name: otelcol-contrib

  ports:
  #   otlp:
  #     enabled: true
  #     containerPort: 4317
  #     servicePort: 4317

  #   otlp-http:
  #     enabled: true
  #     containerPort: 3030
  #     servicePort: 3030

    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:3030"
      # prometheus:
      #   config:
      #     scrape_configs:
      #       - job_name: opentelemetry-collector
      #         scrape_interval: 10s
      #         static_configs:
      #           - targets:
      #               - ${env:MY_POD_IP}:8888

    exporters:
      logging: {}
      loki:
        endpoint: http://kbot-loki:3100/loki/api/v1/push
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [logging, loki]
        traces:
          receivers: [otlp]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          exporters: [logging, prometheus]

# -------------------------------------------------------------------
# Graphana
# -------------------------------------------------------------------
grafana:
  adminPassword: admin

  service:
    type: NodePort

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://kbot-prometheus-server:9090
          access: proxy
          isDefault: true

        - name: Loki
          type: loki
          uid: loki
          url: http://kbot-loki:3100
          access: proxy
# -------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------
prometheus:
  extraScrapeConfigs: |
    - job_name: "otel-collector"
      static_configs:
        - targets:
            - kbot-opentelemetry-collector:8889

  server:
    service:
      servicePort: 9090

    persistentVolume:
      enabled: true
      size: 10Gi
# -------------------------------------------------------------------
# Loki
# -------------------------------------------------------------------
loki:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 24
      max_streams_per_user: 10000
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

test_pod:
  enabled: false

promtail:
  enabled: false


