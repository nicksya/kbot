# -------------------------------------------------------------------
# kbot application settings (UNCHANGED)
# -------------------------------------------------------------------
replicaCount: 1
image:
  repository: mykytakhomenko/kbot
  tag: "v1.0.7-otel"
  arch: arm64
  os: linux
  registry: "docker.io"
secret:
  envName: "TELE_TOKEN"
  tokenKey: "token"
  tokenName: "kbot"
securityContext:
  privileged: true

# kbot → observability wiring
env:
  - name: METRICS_HOST
    value: "kbot-opentelemetry-collector:4317"

# -------------------------------------------------------------------
# OpenTelemetry Collector
# -------------------------------------------------------------------
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  #   tag: 0.78.0-arm64
  command:
    name: otelcol-contrib

  ports:
  #   otlp:
  #     enabled: true
  #     containerPort: 4317
  #     servicePort: 4317

  #   otlp-http:
  #     enabled: true
  #     containerPort: 3030
  #     servicePort: 3030

    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:3030"
      # prometheus:
      #   config:
      #     scrape_configs:
      #       - job_name: opentelemetry-collector
      #         scrape_interval: 10s
      #         static_configs:
      #           - targets:
      #               - ${env:MY_POD_IP}:8888

    exporters:
      logging: {}
      loki:
        endpoint: http://kbot-loki:3100/loki/api/v1/push
      prometheus:
        endpoint: "0.0.0.0:8889"

    service:
      pipelines:
        logs:
          receivers: [otlp]
          exporters: [logging, loki]
        traces:
          receivers: [otlp]
          exporters: [logging]
        metrics:
          receivers: [otlp]
          exporters: [logging, prometheus]

# -------------------------------------------------------------------
# Graphana
# -------------------------------------------------------------------
grafana:
  adminPassword: admin

  service:
    type: NodePort

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://kbot-prometheus-server:9090
          access: proxy
          isDefault: true

        - name: Loki
          type: loki
          uid: loki
          url: http://kbot-loki:3100
          access: proxy
# -------------------------------------------------------------------
# Prometheus
# -------------------------------------------------------------------
prometheus:
  extraScrapeConfigs: |
    - job_name: "otel-collector"
      static_configs:
        - targets:
            - kbot-opentelemetry-collector:8889

  server:
    service:
      servicePort: 9090

    persistentVolume:
      enabled: true
      size: 10Gi
# -------------------------------------------------------------------
# Loki
# -------------------------------------------------------------------
loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false   # disable canary + agent


