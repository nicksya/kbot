replicaCount: 1
image:
  repository: mykytakhomenko/kbot
  tag: "v1.0.7-otel"
  arch: arm64
  os: linux
  registry: "docker.io"
secret:
  envName: "TELE_TOKEN"
  tokenKey: "token"
  tokenName: "kbot"
securityContext:
  privileged: true
env:
  - name: METRICS_HOST
    value: "opentelemetry-collector:4317"